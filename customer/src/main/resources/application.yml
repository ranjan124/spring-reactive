spring:
  application:
    name: customer
  datasource:
    url: jdbc:postgresql://${DB_URL:localhost}:5432/st_customer
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
