name: aggregator
networks:
  shieldteq:

services:
  st-postgres:
    image: postgres
    container_name: postgres
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db-users.sh:/docker-entrypoint-initdb.d/init-db-users.sh

volumes:
  pgdata:
    driver: local
